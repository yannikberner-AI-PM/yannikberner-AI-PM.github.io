name = "slack-news-trigger"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Set these with `wrangler secret put <NAME>` — do not put real values here:
#   SLACK_SIGNING_SECRET  - from the Slack app's "Basic Information" page
#   GITHUB_TOKEN          - fine-grained PAT with "Actions: write" on this repo
#   GITHUB_OWNER          - e.g. "yannikberner-AI-PM"
#   GITHUB_REPO           - e.g. "yannikberner-AI-PM.github.io"
#   GITHUB_REF            - branch to run the workflow on, e.g. "main"
