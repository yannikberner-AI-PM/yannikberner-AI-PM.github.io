name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site lives at the repository root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for Pages build to finish
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const maxAttempts = 60;
            const delaySeconds = 30;
            const delay = (s) => new Promise((r) => setTimeout(r, s * 1000));
            core.info(`Waiting for Pages build for ${owner}/${repo}`);
            for (let i = 0; i < maxAttempts; i++) {
              const res = await github.rest.repos.getLatestPagesBuild({ owner, repo });
              const status = res.data.status;
              core.info(`Pages build status: ${status} (attempt ${i + 1}/${maxAttempts})`);
              if (status === 'built') {
                core.info('Pages built successfully.');
                return;
              }
              if (status === 'errored' || status === 'failed') {
                throw new Error('Pages build failed: ' + JSON.stringify(res.data));
              }
              await delay(delaySeconds);
            }
            throw new Error(`Timed out waiting for Pages build after ${maxAttempts * delaySeconds} seconds.`);
