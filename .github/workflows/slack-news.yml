name: Slack Career News

# Daily post moved to career-intelligence-agent-private
# (LaunchAgent com.career-intelligence.energy-news). Keep workflow_dispatch
# only so this GitHub Action does not double-post to Slack.
on:
  workflow_dispatch: {}

concurrency:
  group: slack-career-news

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send latest news to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python scripts/send_slack_news.py

      - name: Persist news cache
        run: |
          if ! git diff --quiet -- scripts/.news_cache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/.news_cache.json
            git commit -m "Update sent-news cache [skip ci]"
            git push
          else
            echo "No cache changes to commit."
          fi
