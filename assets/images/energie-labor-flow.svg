<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Energie-Labor · Product flow</title><desc id="desc">Schematic illustration: household inputs lead to three explicit cost assumptions and an informed decision. This is a product diagram.</desc><rect width="1200" height="675" rx="20" fill="#f7f7f7"/><text x="60" y="78" fill="#411564" font-family="system-ui" font-size="24">ENERGIE-LABOR</text><text x="60" y="138" fill="#411564" font-family="system-ui" font-size="38" font-weight="700">Inputs → Assumptions → Decision</text><g font-family="system-ui" fill="#4c4c4c"><rect x="60" y="200" width="300" height="310" rx="18" fill="white" stroke="#d9d0e0"/><text x="90" y="248" font-size="22" font-weight="700">01 · Your home</text><text x="90" y="300" font-size="20">Consumption</text><text x="90" y="345" font-size="20">Existing devices</text><text x="90" y="390" font-size="20">Current contract</text><rect x="420" y="200" width="330" height="310" rx="18" fill="white" stroke="#d9d0e0"/><text x="450" y="248" font-size="22" font-weight="700">02 · Three price paths</text><path d="M455 440 L705 395" stroke="#008577" stroke-width="5"/><path d="M455 440 L705 340" stroke="#75618b" stroke-width="5"/><path d="M455 440 L705 280" stroke="#b8892c" stroke-width="5"/><rect x="810" y="200" width="330" height="310" rx="18" fill="white" stroke="#d9d0e0"/><text x="840" y="248" font-size="22" font-weight="700">03 · Compare options</text><text x="840" y="305" font-size="20">Annual and total costs</text><text x="840" y="350" font-size="20">Explicit assumptions</text><rect x="840" y="390" width="270" height="65" rx="10" fill="#f4d43a"/><text x="865" y="431" font-size="20" fill="#411564">Prepare your decision</text><text x="60" y="590" font-size="18">Product diagram · Assumption-based scenarios · Separate investment calculations</text></g></svg>